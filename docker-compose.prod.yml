# Il proxy della macchina pubblica: Caddy, con i certificati veri.
#
# Fino al 3.28 qui c'era anche il nostro gestionale (zd-app, zd-db,
# zd-whatsapp). Dal 3.29 il nostro è una squadra ospitata come le altre,
# «zerodark» (deploy/squadra-server.sh, docker-compose.squadra.yml, il Postgres
# comune): qui resta solo il proxy, che serve tutti i siti della macchina —
# ognuno col suo file in siti/.
#
#   docker compose -p gestionale -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Il nome del progetto resta «gestionale»: cambiarlo vorrebbe dire volumi nuovi
# per i certificati, e Caddy li richiederebbe tutti da capo.
#
# Il TAK **non sta qui dentro**: ha una sua distribuzione con il suo compose e
# il suo database, e ogni suo aggiornamento romperebbe questo file. Sta sulla
# stessa macchina, a fianco, con le sue porte. La spiegazione è in
# `deploy/DEPLOY.md`.

services:
  # Caddy al posto di nginx, e solo qui.
  #
  # Non per gusto: il certificato lo chiede, lo installa e lo rinnova da solo,
  # senza certbot, senza cron e senza il giro dell'uovo e della gallina in cui
  # nginx non parte perché il certificato non c'è ancora e il certificato non
  # arriva perché nginx non parte. In LAN resta nginx con l'autofirmato, dove
  # non c'è niente da rinnovare e quel giro non serve.
  proxy:
    image: caddy:2-alpine
    container_name: zd-proxy
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?serve il nome a dominio, es. gestionale.zerodark.it}
      EMAIL_CERTIFICATI: ${EMAIL_CERTIFICATI:?serve un'email per gli avvisi di Let's Encrypt}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # altri siti serviti dalla stessa macchina (es. il sito della squadra):
      # un file .caddy per sito, sul server e fuori dal repository
      - ./siti:/etc/caddy/siti:ro
      # i certificati ottenuti: senza questo volume, ogni riavvio ne
      # richiederebbe di nuovi e Let's Encrypt ha un limite settimanale
      - caddy-dati:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Qui solo la rete del gestionale. Ogni altra istanza sulla macchina (test,
    # test2, squadre ospitate) ha una sua rete di bordo, zd-bordo-<istanza>,
    # dove stanno soltanto il proxy e la sua app: il proxy ci entra con
    # `docker network connect`, dagli script che le creano e dal rilascio,
    # che lo ricollega dopo averlo ricreato. Nessuna istanza vede le altre,
    # né i loro database, né i servizi di questa.

# I volumi del gestionale di prima (gestionale_db-data, gestionale_uploads,
# gestionale_whatsapp) non sono più qui ma restano sul disco, come copia.
volumes:
  caddy-dati:
  caddy-config:
