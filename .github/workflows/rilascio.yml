# Il rilascio in produzione, lanciato a mano da GitHub (Actions → Rilascio →
# Run workflow). Non parte mai da solo: un push su main non tocca il server.
#
# I modi:
#   prova            si collega al server e guarda soltanto: che versione gira,
#                    cosa arriverebbe con il prossimo rilascio, se il codice sul
#                    server e' pulito, disco, memoria, e com'e' messo il test.
#                    Non cambia niente.
#   rilascio         la produzione, con i passi di deploy/DEPLOY.md: backup,
#                    pull, ricostruzione, riavvio del proxy, pulizia, controllo.
#   test             l'ambiente di test (https://test.zerodarkteam.it) portato
#                    al ramo scelto qui sotto. La prima volta lo crea da zero.
#                    La produzione non la tocca.
#   test-copia-dati  database e allegati della produzione copiati nel test. La
#                    produzione la legge soltanto.
#
# Il lavoro del test lo fa deploy/test-server.sh, mandato al server da qui.
#
# Le credenziali stanno nei secret del repository, mai qui: il repository e'
# pubblico.
#   SERVER_USER          l'utente con cui si entra
#   SERVER_SSH_KEY       la chiave privata, una fatta apposta per i rilasci
#
# Il nome del server e la sua impronta invece stanno qui: sono pubblici (il
# server li mostra a chiunque si colleghi) e scritti nel file non si possono
# sbagliare nel copia-incolla. L'impronta serve a non fidarsi di chiunque
# risponda a quel nome; se un giorno il server viene rifatto, cambia e va
# aggiornata qui (ssh-keygen -F ops.zerodarkteam.it dal PC di chi ci entra).

name: Rilascio

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'prova = guarda soltanto · rilascio = produzione · test = ambiente di test'
        type: choice
        options: [prova, rilascio, test, test-copia-dati]
        default: prova
      ramo:
        description: 'Solo per «test»: il ramo da mettere nel test'
        type: string
        default: main

# mai due lavori insieme sulla stessa macchina: due build in parallelo non
# ci stanno nei suoi 4 GB
concurrency:
  group: rilascio-produzione
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOST: ops.zerodarkteam.it
  IMPRONTA: ops.zerodarkteam.it ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHXXfS9NeIXEadQBZip3Dc6mPcRLPxRSzmj8HVVpbrt

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Il repository, per gli script da mandare al server
        uses: actions/checkout@v4

      - name: Chiave e impronta del server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Manca il secret SERVER_SSH_KEY"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # incollata da Windows puo' portarsi dietro gli a capo \r: via
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/rilascio
          chmod 600 ~/.ssh/rilascio
          printf '%s\n' "$IMPRONTA" > ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/rilascio > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY non e' una chiave privata leggibile, o ha una passphrase"
            exit 1
          fi

      - name: Prova (non cambia niente)
        if: inputs.modo == 'prova'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s' <<'SUL_SERVER'
          set -euo pipefail
          cd /opt/gestionale
          echo "== Versione in linea"
          curl -s https://ops.zerodarkteam.it/login | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || true
          echo "== Codice sul server"
          git log --oneline -1
          echo "== Modifiche locali sul server (deve essere vuoto, o il pull si ferma)"
          git status --short
          # fetch soltanto: aggiorna i riferimenti, non il codice che gira
          git fetch -q origin
          echo "== Cosa arriverebbe con il rilascio"
          git log --oneline HEAD..origin/main || true
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Il pull --ff-only andrebbe liscio."
          else
            echo "ATTENZIONE: il pull --ff-only si fermerebbe (il server ha commit che main non ha)."
          fi
          echo "== Container"
          docker ps --format '{{.Names}}\t{{.Status}}'
          echo "== Disco"
          df -h /
          echo "== Cosa occupa Docker (e quanto se ne potrebbe liberare)"
          docker system df
          echo "== Macchina"
          echo "processori: $(nproc)"
          uptime
          free -h
          echo "== Consumo dei container adesso"
          docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
          SUL_SERVER
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s -- stato' < deploy/test-server.sh

      - name: Rilascio
        if: inputs.modo == 'rilascio'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s' <<'SUL_SERVER'
          set -euo pipefail
          cd /opt/gestionale
          zd() { docker compose -p gestionale -f docker-compose.prod.yml --env-file .env.prod "$@"; }

          echo "== 1. Backup"
          mkdir -p /root/backup
          docker exec zd-db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/prima.dump'
          docker cp zd-db:/tmp/prima.dump /root/backup/prod-$(date +%F-%H%M).dump

          echo "== 2. Codice nuovo e ricostruzione"
          git pull --ff-only
          # la rete che il proxy divide con l'ambiente di test
          docker network inspect zd-bordo > /dev/null 2>&1 || docker network create zd-bordo
          zd up -d --build

          echo "== 3. Proxy"
          zd restart proxy

          echo "== 4. Pulizia"
          docker image prune -f --filter until=24h
          # la cache delle build con un tetto, non con una data: a settimana
          # erano diventati 57 GB. Il nome dell'opzione e' cambiato fra le
          # versioni di Docker, per questo la seconda riga
          docker builder prune -f --max-used-space 10gb 2>/dev/null \
            || docker builder prune -f --keep-storage 10gb

          echo "== Controllo"
          sleep 15
          curl -s https://ops.zerodarkteam.it/login | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || true
          docker logs zd-app --tail 20
          docker exec zd-proxy caddy validate --config /etc/caddy/Caddyfile
          df -h /
          SUL_SERVER

      - name: Test
        if: inputs.modo == 'test'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          RAMO: ${{ inputs.ramo }}
        run: |
          # il nome del ramo finisce in un comando sul server: solo caratteri da ramo
          if ! printf '%s' "$RAMO" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Nome di ramo non valido: $RAMO"
            exit 1
          fi
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" "bash -s -- rilascia $RAMO" < deploy/test-server.sh

      - name: Test, copia dei dati dalla produzione
        if: inputs.modo == 'test-copia-dati'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s -- copia-dati' < deploy/test-server.sh

      - name: Via la chiave
        if: always()
        run: rm -f ~/.ssh/rilascio
