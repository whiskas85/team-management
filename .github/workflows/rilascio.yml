# Il rilascio in produzione, lanciato a mano da GitHub (Actions → Rilascio →
# Run workflow). Non parte mai da solo: un push su main non tocca il server.
#
# I modi:
#   prova            si collega al server e guarda soltanto: che versione gira,
#                    cosa arriverebbe con il prossimo rilascio, se il codice sul
#                    server e' pulito, disco, memoria, e com'e' messo il test.
#                    Non cambia niente.
#   rilascio         le immagini costruite qui su GitHub (job «pubblica»), poi
#                    sul server: pull, immagini scaricate dal registro, il
#                    nostro gestionale (la squadra «zerodark») aggiornato con
#                    backup e ritorno indietro, proxy, le altre squadre (che
#                    restano alla loro versione), pulizia, controllo.
#   test             l'ambiente di test (https://test.zerodarkteam.it) portato
#                    al ramo scelto qui sotto. La prima volta lo crea da zero.
#                    La produzione non la tocca.
#   test-copia-dati  database e allegati della produzione copiati nel test. La
#                    produzione la legge soltanto.
#   test-azzera      il test portato al ramo scelto e svuotato: database e
#                    allegati cancellati, come un gestionale appena nato (per
#                    provare il primo accesso). La produzione non la tocca.
#   squadra-nuova    il gestionale di un'altra squadra, ospitato qui col suo
#                    nome (campi «squadra», «dominio», «nome», «email»). Prima
#                    la squadra punta il suo nome a ops.zerodarkteam.it. Nasce
#                    con la versione della produzione e la tiene: la aggiorna
#                    il portale ZeroDark (hook update_app), non il «rilascio».
#   squadra-dominio  una squadra ospitata cambia nome a dominio (campi
#                    «squadra» e «dominio», il nuovo, già puntato qui). Il
#                    vecchio nome rimanda al nuovo per sei mesi, e le squadre
#                    collegate vengono avvisate dal gestionale stesso.
#   squadre          solo lo stato delle squadre ospitate.
#   console          il server visto dal portale ZeroDark: collega gli hook
#                    all'agent, e mostra agent, hook, versioni, gestionali.
#
# Il lavoro del test lo fa deploy/test-server.sh, mandato al server da qui.
#
# Le credenziali stanno nei secret del repository, mai qui: il repository e'
# pubblico.
#   SERVER_USER          l'utente con cui si entra
#   SERVER_SSH_KEY       la chiave privata, una fatta apposta per i rilasci
#
# Il nome del server e la sua impronta invece stanno qui: sono pubblici (il
# server li mostra a chiunque si colleghi) e scritti nel file non si possono
# sbagliare nel copia-incolla. L'impronta serve a non fidarsi di chiunque
# risponda a quel nome; se un giorno il server viene rifatto, cambia e va
# aggiornata qui (ssh-keygen -F ops.zerodarkteam.it dal PC di chi ci entra).

name: Rilascio

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'prova = guarda soltanto · rilascio = produzione · test = ambiente di test'
        type: choice
        options: [prova, rilascio, test, test-copia-dati, test-azzera, prova-collegamento, squadra-nuova, squadra-dominio, squadre, console]
        default: prova
      ramo:
        description: 'Per «test» e «test-azzera»: il ramo da mettere nel test'
        type: string
        default: main
      istanza:
        description: 'Per «test» e «test-azzera»: quale ambiente (test2 = squadra finta per il collegamento fra gestionali)'
        type: choice
        options: [test, test2]
        default: test
      squadra:
        description: 'Per «squadra-nuova» e «squadra-dominio»: nome breve, minuscole e trattini (es. pippo)'
        type: string
        default: ''
      dominio:
        description: 'Per «squadra-nuova» e «squadra-dominio»: il nome, già puntato qui (es. gestionale.pippo.it)'
        type: string
        default: ''
      nome:
        description: 'Solo per «squadra-nuova»: il nome della squadra (es. Pippo Softair)'
        type: string
        default: ''
      email:
        description: 'Solo per «squadra-nuova»: email dell''admin di partenza (vuota = admin@dominio)'
        type: string
        default: ''

# mai due lavori insieme sulla stessa macchina
concurrency:
  group: rilascio-produzione
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOST: ops.zerodarkteam.it
  IMPRONTA: ops.zerodarkteam.it ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHXXfS9NeIXEadQBZip3Dc6mPcRLPxRSzmj8HVVpbrt

jobs:
  server:
    # nel rilascio, dopo «pubblica»: le immagini le scarica, non le costruisce.
    # Negli altri modi «pubblica» non c'è e si parte subito; se «pubblica»
    # fallisce il rilascio va avanti lo stesso, e il server le costruisce lui.
    needs: pubblica
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Il repository, per gli script da mandare al server
        uses: actions/checkout@v4

      - name: Chiave e impronta del server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Manca il secret SERVER_SSH_KEY"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # incollata da Windows puo' portarsi dietro gli a capo \r: via
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/rilascio
          chmod 600 ~/.ssh/rilascio
          printf '%s\n' "$IMPRONTA" > ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/rilascio > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY non e' una chiave privata leggibile, o ha una passphrase"
            exit 1
          fi

      - name: Prova (non cambia niente)
        if: inputs.modo == 'prova'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s' <<'SUL_SERVER'
          set -euo pipefail
          cd /opt/gestionale
          echo "== Versione in linea"
          curl -s https://ops.zerodarkteam.it/login | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || true
          echo "== Codice sul server"
          git log --oneline -1
          echo "== Modifiche locali sul server (deve essere vuoto, o il pull si ferma)"
          git status --short
          # cosa c'e' di cambiato a mano nel Caddyfile (le righe con password o
          # hash restano fuori: il log e' pubblico)
          git diff deploy/Caddyfile | grep -viE 'basicauth|hash|password|\$2[aby]\$' || true
          echo "== Siti in siti/"
          ls -1 siti/ 2>/dev/null || true
          # fetch soltanto: aggiorna i riferimenti, non il codice che gira
          git fetch -q origin
          echo "== Cosa arriverebbe con il rilascio"
          git log --oneline HEAD..origin/main || true
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Il pull --ff-only andrebbe liscio."
          else
            echo "ATTENZIONE: il pull --ff-only si fermerebbe (il server ha commit che main non ha)."
          fi
          echo "== Container"
          docker ps --format '{{.Names}}\t{{.Status}}'
          echo "== Disco"
          df -h /
          echo "== Cosa occupa Docker (e quanto se ne potrebbe liberare)"
          docker system df
          echo "== Macchina"
          echo "processori: $(nproc) ($(uname -m))"
          uptime
          free -h
          echo "== Consumo dei container adesso"
          docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
          # Per capire quanto pesa davvero un gestionale: la produzione, non i
          # test (sono quasi vuoti). Il picco di memoria è quello da quando il
          # container è partito; solo letture.
          echo "== Il nostro gestionale: memoria di picco dall'avvio"
          for c in zd-sq-zerodark-app zd-sq-zerodark-whatsapp zd-sq-pg zd-app zd-db zd-whatsapp; do
            id=$(docker inspect -f '{{.Id}}' "$c" 2>/dev/null) || continue
            avvio=$(docker inspect -f '{{.State.StartedAt}}' "$c" | cut -c1-16)
            f=/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak
            [ -r "$f" ] || f=/sys/fs/cgroup/memory/docker/$id/memory.max_usage_in_bytes
            if [ -r "$f" ]; then
              echo "$c  picco $(( $(cat "$f") / 1048576 )) MiB  (partito $avvio)"
            else
              echo "$c  picco non leggibile"
            fi
          done
          echo "== Il nostro gestionale: dati"
          Q="
            select 'database', pg_size_pretty(pg_database_size(current_database()))
            union all select 'persone', count(*)::text from \"User\"
            union all select 'attivita', count(*)::text from \"Event\"
            union all select 'adesioni', count(*)::text from \"EventRsvp\"
            union all select 'pagamenti', count(*)::text from \"Payment\""
          if docker ps -q --filter name=^zd-sq-zerodark-app$ | grep -q .; then
            docker exec zd-sq-pg psql -U sq_zerodark -d sq_zerodark -At -F ' ' -c "$Q" || true
            echo "allegati: $(docker exec zd-sq-zerodark-app du -sh /data/uploads 2>/dev/null | cut -f1)"
          else
            U=$(docker exec zd-db printenv POSTGRES_USER); D=$(docker exec zd-db printenv POSTGRES_DB)
            docker exec zd-db psql -U "$U" -d "$D" -At -F ' ' -c "$Q" || true
            echo "allegati: $(docker exec zd-app du -sh /data/uploads 2>/dev/null | cut -f1)"
          fi
          SUL_SERVER
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s -- stato' < deploy/test-server.sh

      - name: Rilascio
        if: inputs.modo == 'rilascio'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTORE: ${{ github.actor }}
          REGISTRO: ghcr.io/${{ github.repository_owner }}
        run: |
          SSH="ssh -i $HOME/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519"
          # Il server entra nel registro con il token di questo lavoro, che
          # scade quando il lavoro finisce: passa per stdin, mai sulla riga di
          # comando, e alla fine si esce («Fuori dal registro»).
          printf '%s' "$GH_TOKEN" | $SSH "$UTENTE@$HOST" "docker login ghcr.io -u '$ATTORE' --password-stdin" > /dev/null \
            || echo "::warning::Accesso al registro non riuscito: il server costruira' le immagini da se'"
          $SSH "$UTENTE@$HOST" "REGISTRO='$REGISTRO' bash -s" <<'SUL_SERVER'
          set -euo pipefail
          cd /opt/gestionale
          zd() { docker compose -p gestionale -f docker-compose.prod.yml --env-file .env.prod "$@"; }
          export REGISTRO

          echo "== 1. Il Caddyfile toccato a mano sul server"
          # Quello aggiunto a mano in fondo (la console) diventa un sito suo in
          # siti/locale.caddy, e il file torna quello del repository: così il
          # pull non si ferma e niente va perso (copia in /root/backup).
          if ! git diff --quiet deploy/Caddyfile; then
            mkdir -p /root/backup siti
            cp deploy/Caddyfile "/root/backup/Caddyfile-locale-$(date +%F-%H%M)"
            sed -n '/^import \/etc\/caddy\/siti\/\*\.caddy/,$p' deploy/Caddyfile | tail -n +2 > /tmp/zd-locale.caddy
            if grep -q '[^[:space:]]' /tmp/zd-locale.caddy; then
              dove=siti/locale.caddy
              [ -f "$dove" ] && dove="siti/locale-$(date +%Y%m%d%H%M).caddy"
              { echo "# Spostato dal Caddyfile dal rilascio del $(date +%F)"; cat /tmp/zd-locale.caddy; } > "$dove"
              echo "aggiunte a mano spostate in $dove"
            fi
            rm -f /tmp/zd-locale.caddy
            git checkout -- deploy/Caddyfile
          fi

          echo "== 2. Codice nuovo e immagini"
          git pull --ff-only
          V=$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          # Costruite su GitHub (job «pubblica»): qui si scaricano soltanto.
          # La build sul server mangiava quasi un giga di memoria per qualche
          # minuto; resta solo come riserva, se il registro non le ha.
          # (GitHub le costruisce per x86: su un'altra architettura si compila qui)
          if [ "$(uname -m)" = x86_64 ] && docker pull -q "$REGISTRO/gestionale-app:$V" > /dev/null \
            && docker pull -q "$REGISTRO/gestionale-whatsapp:$V" > /dev/null; then
            for img in gestionale-app gestionale-whatsapp; do
              docker tag "$REGISTRO/$img:$V" "$img:$V"
              docker tag "$REGISTRO/$img:$V" "$img:latest"
            done
            echo "immagini $V scaricate dal registro"
          else
            echo "!! le immagini $V non sono nel registro: le costruisco qui"
            docker build -q -t "gestionale-app:$V" -t gestionale-app:latest .
            docker build -q -t "gestionale-whatsapp:$V" -t gestionale-whatsapp:latest ./whatsapp
          fi

          echo "== 3. Il nostro gestionale: la squadra «zerodark»"
          # come tutte le altre: backup, versione nuova, ritorno indietro se
          # non risponde. La prima volta lascia il compose vecchio (zd-app,
          # zd-db) e diventa la squadra (migra-produzione).
          if [ -f /opt/squadra-zerodark/.env.squadra ]; then
            bash deploy/squadra-server.sh aggiorna zerodark "$V"
          else
            bash deploy/squadra-server.sh migra-produzione
          fi

          echo "== 4. Proxy"
          # Se il compose del proxy è cambiato, «up» lo ricrea e il proxy perde
          # le reti in cui era stato aggiunto a mano (squadre, test, console):
          # si annotano prima e si ricollegano dopo. Il riavvio rilegge il
          # Caddyfile, che è montato come file.
          reti=$(docker inspect zd-proxy -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || true)
          zd up -d proxy
          for r in $reti $(docker network ls --format '{{.Name}}' | grep '^zd-bordo-' || true); do
            docker network inspect "$r" --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null \
              | grep -qw zd-proxy || docker network connect "$r" zd-proxy 2>/dev/null || true
          done
          zd restart proxy

          echo "== 5. Le squadre ospitate"
          # ognuna riparte con la sua versione (proxy, chiavi nuove), senza cambiarla
          bash deploy/squadra-server.sh rilascia-tutte
          bash deploy/squadra-server.sh pulisci-versioni
          # gli hook nuovi del portale ZeroDark, se c'è il suo agent
          bash deploy/squadra-server.sh collega-hook

          echo "== 6. Pulizia"
          docker image prune -f --filter until=24h
          # la cache delle build con un tetto, non con una data: a settimana
          # erano diventati 57 GB. Il nome dell'opzione e' cambiato fra le
          # versioni di Docker, per questo la seconda riga
          docker builder prune -f --max-used-space 10gb 2>/dev/null \
            || docker builder prune -f --keep-storage 10gb

          echo "== Controllo"
          sleep 15
          curl -s https://ops.zerodarkteam.it/login | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || true
          docker logs zd-sq-zerodark-app --tail 20 2>&1 | grep -vi password || true
          docker exec zd-proxy caddy validate --config /etc/caddy/Caddyfile
          df -h /
          SUL_SERVER

      - name: Test
        if: inputs.modo == 'test'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          RAMO: ${{ inputs.ramo }}
          ISTANZA: ${{ inputs.istanza }}
        run: |
          # il nome del ramo finisce in un comando sul server: solo caratteri da ramo
          if ! printf '%s' "$RAMO" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Nome di ramo non valido: $RAMO"
            exit 1
          fi
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" "ISTANZA=$ISTANZA bash -s -- rilascia $RAMO" < deploy/test-server.sh

      - name: Ambiente di test, azzerato
        if: inputs.modo == 'test-azzera'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          RAMO: ${{ inputs.ramo }}
          ISTANZA: ${{ inputs.istanza }}
        run: |
          # il nome del ramo finisce in un comando sul server: solo caratteri da ramo
          if ! printf '%s' "$RAMO" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Nome di ramo non valido: $RAMO"
            exit 1
          fi
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" "ISTANZA=$ISTANZA bash -s -- azzera $RAMO" < deploy/test-server.sh

      - name: Squadra ospitata, nuova
        if: inputs.modo == 'squadra-nuova'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          SQUADRA: ${{ inputs.squadra }}
          DOMINIO: ${{ inputs.dominio }}
          NOME: ${{ inputs.nome }}
          EMAIL: ${{ inputs.email }}
        run: |
          # tutto finisce in un comando sul server: prima si guarda cosa c'e' dentro
          printf '%s' "$SQUADRA" | grep -Eq '^[a-z][a-z0-9-]{1,29}$' || { echo "::error::Nome breve non valido: $SQUADRA"; exit 1; }
          printf '%s' "$DOMINIO" | grep -Eq '^[a-z0-9.-]+$' || { echo "::error::Dominio non valido: $DOMINIO"; exit 1; }
          printf '%s' "$NOME" | grep -Eq '^[[:alnum:] ._&-]*$' || { echo "::error::Nel nome solo lettere, cifre, spazi e . _ & -"; exit 1; }
          printf '%s' "$EMAIL" | grep -Eq '^([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)?$' || { echo "::error::Email non valida: $EMAIL"; exit 1; }
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" "SQUADRA='$SQUADRA' DOMINIO='$DOMINIO' NOME='$NOME' EMAIL='$EMAIL' bash -s -- nuova" < deploy/squadra-server.sh

      - name: Squadra ospitata, cambio di dominio
        if: inputs.modo == 'squadra-dominio'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
          SQUADRA: ${{ inputs.squadra }}
          DOMINIO: ${{ inputs.dominio }}
        run: |
          printf '%s' "$SQUADRA" | grep -Eq '^[a-z][a-z0-9-]{1,29}$' || { echo "::error::Nome breve non valido: $SQUADRA"; exit 1; }
          printf '%s' "$DOMINIO" | grep -Eq '^[a-z0-9.-]+$' || { echo "::error::Dominio non valido: $DOMINIO"; exit 1; }
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" "SQUADRA='$SQUADRA' DOMINIO='$DOMINIO' bash -s -- dominio" < deploy/squadra-server.sh

      - name: Squadre ospitate, stato
        if: inputs.modo == 'squadre'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s -- stato' < deploy/squadra-server.sh

      - name: Portale ZeroDark, hook e stato
        if: inputs.modo == 'console'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          # dal codice del server (/opt/gestionale), non da quello del runner:
          # i link devono puntare lì
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash /opt/gestionale/deploy/squadra-server.sh console'

      - name: Test, copia dei dati dalla produzione
        if: inputs.modo == 'test-copia-dati'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'bash -s -- copia-dati' < deploy/test-server.sh

      # test e test2 si collegano fra loro come farebbero due squadre vere
      # (docs/COLLEGAMENTO-SQUADRE.md). Le password del proxy si leggono dal
      # server e si mascherano prima di tutto: questo log è pubblico.
      - name: Prova del collegamento, le password del proxy
        if: inputs.modo == 'prova-collegamento'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          leggi() {
            ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
              "$UTENTE@$HOST" "grep '^PROXY_PASSWORD=' /opt/gestionale-$1/.env.test | cut -d= -f2-"
          }
          a=$(leggi test); b=$(leggi test2)
          if [ -z "$a" ] || [ -z "$b" ]; then
            echo "::error::Manca un ambiente: rilascia prima test e test2"
            exit 1
          fi
          echo "::add-mask::$a"
          echo "::add-mask::$b"
          { echo "PROXY_A=$a"; echo "PROXY_B=$b"; } >> "$GITHUB_ENV"

      - name: Prova del collegamento, il browser
        if: inputs.modo == 'prova-collegamento'
        run: |
          mkdir -p /tmp/prova && cp deploy/prova-collegamento.mjs /tmp/prova/
          cd /tmp/prova
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node prova-collegamento.mjs

      - name: Fuori dal registro
        if: always() && inputs.modo == 'rilascio'
        env:
          UTENTE: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/rilascio -o StrictHostKeyChecking=yes -o BatchMode=yes -o HostKeyAlgorithms=ssh-ed25519 \
            "$UTENTE@$HOST" 'docker logout ghcr.io' > /dev/null 2>&1 || true

      - name: Via la chiave
        if: always()
        run: rm -f ~/.ssh/rilascio

  # Le stesse immagini della produzione, pubblicate nel registro di GitHub con
  # il nome della versione (ghcr.io/whiskas85/gestionale-app:3.25.0): così un
  # server che non le costruisce — quello di un'altra squadra, gestito dal
  # portale ZeroDark — le scarica (REGISTRO in deploy/squadra-server.sh). E una
  # release di GitHub con il pezzo di CHANGELOG di quella versione: il portale
  # la legge per sapere cosa c'è di nuovo prima di aggiornare.
  pubblica:
    if: inputs.modo == 'rilascio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: v
        run: echo "v=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immagine del gestionale
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestionale-app:${{ steps.v.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/gestionale-app:latest

      - name: Immagine del ponte WhatsApp
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestionale-whatsapp:${{ steps.v.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/gestionale-whatsapp:latest

      - name: Release con le novità
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.v }}
        run: |
          # il pezzo di CHANGELOG fra il titolo di questa versione e il successivo
          awk -v v="$V" '$0 ~ "^## "v" " {dentro=1; next} /^## / && dentro {exit} dentro' CHANGELOG.md > note.md
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "La release v$V c'e' gia'"
          else
            gh release create "v$V" --title "$V" --notes-file note.md --target "$GITHUB_SHA"
          fi
