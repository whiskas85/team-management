services:
  db:
    image: postgres:16-alpine
    container_name: ${NOME_STACK:-zd}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerodark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerodark}
      POSTGRES_DB: ${POSTGRES_DB:-zerodark}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zerodark} -d ${POSTGRES_DB:-zerodark}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ${NOME_STACK:-zd}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zerodark}:${POSTGRES_PASSWORD:-zerodark}@db:5432/${POSTGRES_DB:-zerodark}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-cambia-questa-chiave-in-produzione-almeno-32-char}
      # metti 1 solo quando l'app sta dietro HTTPS, altrimenti in LAN il login non tiene
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # 1 = mostra i pulsanti di accesso rapido per figura nella pagina di login
      DEBUG_LOGIN: ${DEBUG_LOGIN:-0}
      UPLOAD_DIR: /data/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@zerodark.team}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ZeroDark2026!}
      NODE_ENV: production
      # "prod" o "test": in test il gestionale mostra una fascia di avviso e
      # rifiuta le operazioni che consumano risorse vere sul portale federale
      AMBIENTE: ${AMBIENTE:-prod}
      # senza fuso esplicito il container gira in UTC e gli orari degli eventi
      # slittano rispetto a quelli digitati dagli operatori
      TZ: ${TZ:-Europe/Rome}
      # il ponte verso WhatsApp, raggiungibile solo dentro la rete di Docker
      WHATSAPP_URL: http://whatsapp:3001
      SEGRETO_WHATSAPP: ${SEGRETO_WHATSAPP:-}
    volumes:
      - uploads:/data/uploads
    ports:
      # in chiaro resta raggiungibile solo dalla macchina stessa: da fuori si
      # passa dal proxy, che cifra. Con COOKIE_SECURE=1 un accesso in http non
      # funzionerebbe comunque, e sembrerebbe un guasto invece di una scelta
      - "${BIND_APP:-0.0.0.0}:${APP_PORT:-3000}:3000"

  # Termina l'HTTPS con un certificato nostro: nessuna autorità può firmare un
  # indirizzo privato come 10.x.x.x, quindi il browser avvisa comunque. Serve a
  # non far viaggiare le password in chiaro, non a dimostrare chi siamo.
  proxy:
    image: nginx:1.27-alpine
    container_name: ${NOME_STACK:-zd}-proxy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Suffisso della porta pubblica per il rimando: vuoto sulla 443, che è
      # implicita. Il "-" senza due punti serve a distinguere "variabile vuota"
      # da "variabile assente": con ":-" una stringa vuota verrebbe scartata.
      PORTA_HTTPS: ${SUFFISSO_HTTPS-:8443}
      # sostituisci solo le nostre, non le variabili di nginx
      NGINX_ENVSUBST_FILTER: PORTA_
    volumes:
      - ./certificati/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certificati:/etc/nginx/certificati:ro
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8080}:80"

  # Ponte verso WhatsApp: tiene la sessione aperta come farebbe un telefono
  # collegato. Non pubblica porte — ci arriva solo il gestionale, dalla rete
  # interna di Docker, presentando il segreto condiviso.
  whatsapp:
    build: ./whatsapp
    container_name: ${NOME_STACK:-zd}-whatsapp
    restart: unless-stopped
    environment:
      SEGRETO_WHATSAPP: ${SEGRETO_WHATSAPP:-}
      LIVELLO_LOG: ${LIVELLO_LOG_WHATSAPP:-warn}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - whatsapp:/dati

volumes:
  db-data:
  uploads:
  whatsapp:
